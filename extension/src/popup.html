<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Subtitle Overlay</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Субтитры поверх видео</h1>
    <div id="status" class="status">Проверяю страницу…</div>
    <div id="diag" class="diag"></div>
  </header>

  <section id="videoSection" class="block hidden">
    <label class="lbl" for="videoSelect">Видео на странице</label>
    <select id="videoSelect"></select>
  </section>

  <section class="block">
    <button id="pickBtn" class="primary">Загрузить субтитры (.srt / .ass)</button>
    <input id="fileInput" type="file" accept=".srt,.ass,.ssa" hidden>
    <div class="hint">Можно просто перетащить файл на видео.</div>
    <div id="fileInfo" class="fileinfo hidden"></div>
    <button id="clearBtn" class="ghost hidden">Убрать субтитры</button>
  </section>

  <section id="shiftSection" class="block hidden">
    <label class="lbl">Сдвиг тайминга</label>
    <div class="row">
      <button data-shift="-5" class="sm">−5 с</button>
      <button data-shift="-0.5" class="sm">−0,5</button>
      <output id="shiftValue">0,00 с</output>
      <button data-shift="0.5" class="sm">+0,5</button>
      <button data-shift="5" class="sm">+5 с</button>
    </div>
    <div class="row">
      <button id="resetShift" class="ghost sm">Сброс</button>
      <span class="hint">Клавиши: <b>G</b> / <b>H</b> — ±0,5 с, <b>Shift+G/H</b> — ±5 с, <b>J</b> — сброс</span>
    </div>
    <div id="currentLine" class="current"></div>
  </section>

  <section class="block">
    <label class="lbl" for="fontSize">Размер шрифта <span id="fontSizeVal"></span></label>
    <input id="fontSize" type="range" min="2" max="10" step="0.2">

    <label class="lbl" for="bottomPct">Отступ снизу <span id="bottomPctVal"></span></label>
    <input id="bottomPct" type="range" min="0" max="30" step="1">

    <label class="lbl" for="bgOpacity">Подложка <span id="bgOpacityVal"></span></label>
    <input id="bgOpacity" type="range" min="0" max="0.9" step="0.05">

    <div class="row wrap">
      <label class="chk"><input id="outline" type="checkbox"> Обводка текста</label>
      <label class="chk"><input id="remember" type="checkbox"> Запоминать файл для сайта</label>
    </div>
  </section>

  <script src="subparse.js"></script>
  <script src="popup.js"></script>
</body>
</html>
